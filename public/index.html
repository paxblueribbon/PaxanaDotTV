<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paxana.TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      gap: 1.25rem;
      padding: 2rem 1rem;
    }

    header {
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #888;
    }

    header span { color: #fff; }

    /* ── Channel list view ── */
    #channel-list-view {
      width: min(900px, 96vw);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #channel-list-view h2 {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #555;
      border-bottom: 1px solid #1c1c1c;
      padding-bottom: 0.5rem;
    }

    #channel-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: #111;
      border: 1px solid #222;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .channel-item:hover {
      background: #181818;
      border-color: #444;
    }

    .channel-item .channel-key {
      font-size: 0.9rem;
      color: #ddd;
      flex: 1;
    }

    .channel-item .watch-label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
    }

    #no-channels {
      color: #444;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      padding: 2rem 0;
      text-align: center;
    }

    /* ── Player view ── */
    #player-view {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      width: 100%;
    }

    #player-view.active { display: flex; }

    #back-btn {
      align-self: flex-start;
      background: none;
      border: 1px solid #333;
      color: #888;
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    #back-btn:hover { border-color: #666; color: #ccc; }

    #stage {
      position: relative;
      width: min(900px, 96vw);
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid #222;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    video::-webkit-media-controls { display: none !important; }
    video::-webkit-media-controls-enclosure { display: none !important; }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: rgba(0,0,0,0.7);
    }

    #overlay.hidden { display: none; }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff3b30;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    #status-text {
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 0.1em;
    }

    #live-badge {
      position: absolute;
      top: 12px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(255,59,48,0.85);
      padding: 3px 8px 3px 6px;
      border-radius: 3px;
      opacity: 0;
      transition: opacity 0.4s;
    }

    #live-badge.visible { opacity: 1; }
    #live-badge .dot { width: 6px; height: 6px; background: #fff; }

    #channel-label {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    footer {
      font-size: 0.7rem;
      color: #444;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <header><span>Paxana</span>.TV</header>

  <!-- Channel list view -->
  <div id="channel-list-view">
    <h2>Live Channels</h2>
    <div id="channel-list">
      <div id="no-channels">No streams are live right now.</div>
    </div>
  </div>

  <!-- Player view -->
  <div id="player-view">
    <button id="back-btn">← All Channels</button>
    <div id="stage">
      <video id="player" autoplay muted playsinline></video>
      <div id="live-badge">
        <div class="dot"></div>
        live
      </div>
      <div id="channel-label"></div>
      <div id="overlay">
        <div class="dot"></div>
        <div id="status-text">Connecting…</div>
      </div>
    </div>
  </div>

  <footer>tune in. sit back. enjoy.</footer>

  <script>
    const player       = document.getElementById('player');
    const overlay      = document.getElementById('overlay');
    const statusTxt    = document.getElementById('status-text');
    const liveBadge    = document.getElementById('live-badge');
    const channelLabel = document.getElementById('channel-label');
    const listView     = document.getElementById('channel-list-view');
    const playerView   = document.getElementById('player-view');
    const channelList  = document.getElementById('channel-list');
    const noChannels   = document.getElementById('no-channels');
    const backBtn      = document.getElementById('back-btn');

    const POLL_MS  = 4000;
    const RETRY_MS = 5000;

    let hls       = null;
    let polling   = null;
    let listPoll  = null;
    let activeKey = null;

    // ── Channel list ─────────────────────────────────────────────────────────

    async function refreshChannelList() {
      try {
        const res  = await fetch('/channels');
        const data = await res.json();
        renderChannelList(data.channels);
      } catch (_) {}
    }

    function renderChannelList(channels) {
      channelList.innerHTML = '';
      if (!channels.length) {
        channelList.appendChild(noChannels);
        return;
      }
      channels.forEach(ch => {
        const item = document.createElement('div');
        item.className = 'channel-item';
        item.innerHTML = `
          <div class="dot"></div>
          <div class="channel-key">${escapeHtml(ch.key)}</div>
          <div class="watch-label">watch →</div>
        `;
        item.addEventListener('click', () => watchChannel(ch.key));
        channelList.appendChild(item);
      });
    }

    function startListPolling() {
      refreshChannelList();
      listPoll = setInterval(refreshChannelList, POLL_MS);
    }

    function stopListPolling() {
      if (listPoll) { clearInterval(listPoll); listPoll = null; }
    }

    // ── Player ───────────────────────────────────────────────────────────────

    function watchChannel(key) {
      activeKey = key;
      listView.style.display = 'none';
      playerView.classList.add('active');
      stopListPolling();
      channelLabel.textContent = key;
      attachHls(key);
    }

    function goBack() {
      activeKey = null;
      destroyHls();
      stopPolling();
      playerView.classList.remove('active');
      listView.style.display = '';
      startListPolling();
    }

    function setWaiting(msg) {
      overlay.classList.remove('hidden');
      liveBadge.classList.remove('visible');
      statusTxt.textContent = msg || 'Connecting…';
    }

    function setLive() {
      overlay.classList.add('hidden');
      liveBadge.classList.add('visible');
    }

    function destroyHls() {
      if (hls) { hls.destroy(); hls = null; }
    }

    function attachHls(key) {
      destroyHls();
      setWaiting('Connecting…');
      const hlsUrl = `/hls/live/${encodeURIComponent(key)}/index.m3u8`;

      if (!Hls.isSupported()) {
        // Safari native HLS
        player.src = hlsUrl;
        player.play().catch(() => {});
        setLive();
        return;
      }

      hls = new Hls({
        liveSyncDurationCount: 5,
        liveMaxLatencyDurationCount: 12,
        maxBufferLength: 60,
        backBufferLength: 30,
        lowLatencyMode: false,
        xhrSetup(xhr) {
          xhr.setRequestHeader('Cache-Control', 'no-cache');
        },
      });

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        player.play().catch(() => {});
        setLive();
        stopPolling();
      });

      hls.on(Hls.Events.ERROR, (_, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          hls.recoverMediaError();
        } else {
          destroyHls();
          setWaiting('Stream interrupted – reconnecting…');
          startPolling(key);
        }
      });

      hls.loadSource(hlsUrl);
      hls.attachMedia(player);
    }

    async function checkStream(key) {
      // Guard against stale callbacks after navigating away
      if (activeKey !== key) return;
      try {
        const res  = await fetch(`/status/${encodeURIComponent(key)}`);
        const data = await res.json();
        if (data.live) {
          stopPolling();
          attachHls(key);
        } else {
          stopPolling();
          setWaiting('Stream ended.');
          setTimeout(goBack, 2000);
        }
      } catch (_) {}
    }

    function startPolling(key) {
      if (polling) return;
      checkStream(key);
      polling = setInterval(() => checkStream(key), POLL_MS);
    }

    function stopPolling() {
      if (polling) { clearInterval(polling); polling = null; }
    }

    // ── Helpers ──────────────────────────────────────────────────────────────

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── Init ─────────────────────────────────────────────────────────────────

    backBtn.addEventListener('click', goBack);
    document.addEventListener('click', () => { player.muted = false; }, { once: true });

    startListPolling();
  </script>
</body>
</html>
